name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: lake build + axiom audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately not using lean-action: it refuses to run without a
      # committed lake-manifest.json, and pinning a manifest here would drift
      # from the pinned Mathlib rev. Plain elan + lake keeps it inspectable.
      - name: Install elan (honours ./lean-toolchain)
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Report toolchain
        run: |
          lean --version
          lake --version

      - name: Resolve dependencies (Mathlib rev pinned in lakefile.toml)
        run: lake update

      - name: Download prebuilt Mathlib
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Audit axioms of every declaration in this project
        run: |
          cat > Axioms.lean <<'EOF'
          import LeanProofs
          #print axioms Ordinal.veblen_le_veblen_max
          #print axioms Ordinal.le_iterate_veblen_zero
          #print axioms Ordinal.iterate_veblen_zero_le
          #print axioms Ordinal.veblen_zero_lt_gamma_zero
          #print axioms Ordinal.veblen_le_iterate_succ_veblen_zero
          #print axioms Ordinal.veblen_lt_gamma_zero_of_lt_iterate
          #print axioms Ordinal.veblen_lt_gamma_zero_of_lt_iterate'
          #print axioms Ordinal.veblen_lt_of_fixed
          #print axioms Ordinal.veblen_lt_gamma
          #print axioms Ordinal.veblen_lt_gamma_zero
          #print axioms Ordinal.veblen_mem_Iio_gamma_zero
          #print axioms gamma_zero_closed_under_veblen
          #print axioms omega_lt_gamma_zero
          #print axioms veblen_omega_omega_lt_gamma_zero
          #print axioms veblen_epsilon_zero_epsilon_zero_lt_gamma_zero
          #print axioms LeanProofs.csb
          #print axioms LeanProofs.Olympiad.hm_am3
          #print axioms LeanProofs.Olympiad.nesbitt
          #print axioms LeanProofs.Olympiad.cauchy_schwarz_two
          #print axioms LeanProofs.Olympiad.pow_five_mod_thirty
          #print axioms LeanProofs.Olympiad.sum_cubes
          #print axioms LeanProofs.Olympiad.amgm_one
          EOF
          lake env lean Axioms.lean | tee axioms.log
          if grep -q "sorryAx\|ofReduceBool\|axiomAx" axioms.log; then
            echo "FORBIDDEN AXIOM FOUND"; grep "sorryAx\|ofReduceBool\|axiomAx" axioms.log; exit 1
          fi
          if [ "$(grep -c 'depends on axioms' axioms.log)" -ne 22 ]; then
            echo "expected 22 audited declarations, got $(grep -c 'depends on axioms' axioms.log)"
            exit 1
          fi
          if grep -v 'propext, Classical.choice, Quot.sound' axioms.log | grep 'depends on axioms'; then
            echo "a declaration depends on something outside the allowlist"; exit 1
          fi
          echo "OK: 22/22 declarations, axioms within {propext, Classical.choice, Quot.sound}"
